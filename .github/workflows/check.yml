# Runs `pnpm check` (oxlint, oxfmt --check, typecheck, tests) on every pull request,
# and on pushes to main so the branch's own state stays visible.

name: Check

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
